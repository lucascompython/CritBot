[package]
name = "critbot"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "i18n_macros"
]

[dependencies]
deadpool-postgres = "0.14"
mimalloc = { version = "0.1", features = ["v3"] }
papaya = "0.2"
serde = { version = "1", features = ["derive"] }
poise = { git = "https://github.com/serenity-rs/poise", branch = "serenity-next" }
serenity = { git = "https://github.com/serenity-rs/serenity", branch = "next",  features = ["temp_cache", "transport_compression_zstd", "voice"] } # https://github.com/serenity-rs/serenity/pull/2735#issuecomment-3456282921
# TODO: check the serenity features
songbird = { git = "https://github.com/serenity-rs/songbird", branch = "serenity-next", default-features = false, features =  ["gateway", "native", "serenity"] }
lavalink-rs = { git = "https://github.com/lucascompython/lavalink-rs", branch = "main", default-features = false, features = ["websockets-native-tls", "macros", "songbird", "serenity" ] } # TODO: send PR to udpate deps

# simd-json = {version = "0.17", default-features = false, features = ["serde_impl", "swar-number-parsing"]} see GH issue above
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
i18n_macros = { path = "./i18n_macros" }
postgres-types = { version = "0.2", features = ["derive"] }
base64 = "0.22"
thiserror = "2"
foldhash = { version = "0.2", features = ["nightly"] }
zstd = { version = "0.13", default-features = false, features = ["fat-lto"] }
# rustls = { version = "0.23", default-features = true, features = ["aws-lc-rs"] }

[build-dependencies]
reqwest = { version = "0.12", features = ["blocking"] }

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
